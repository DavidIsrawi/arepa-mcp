name: Deploy to Azure Container Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
  ACR_NAME: ${{ vars.ACR_NAME }}
  IMAGE_NAME: arepa-lab-mcp

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Azure login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build and push image
        run: |
          IMAGE_TAG="${{ github.sha }}"
          FULL_IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}"
          docker build -t "$FULL_IMAGE" -t "${ACR_NAME}.azurecr.io/${IMAGE_NAME}:latest" .
          docker push "$FULL_IMAGE"
          docker push "${ACR_NAME}.azurecr.io/${IMAGE_NAME}:latest"
          echo "FULL_IMAGE=$FULL_IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@8dff69dac3367c32ceb2690d8f13adbeab462703 # v2
        with:
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ env.AZURE_CONTAINER_APP_NAME }}
          imageToDeploy: ${{ env.FULL_IMAGE }}

      - name: Azure logout
        if: always()
        run: az logout
