<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Arepa Lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  {% include "brand_head.html" %}
</head>

<body class="login-shell wood">
  <main class="login-card">

    <div class="text-center mb-8">
      <img class="brand-logo" src="{{ url_for('static', path='arepa-lab.svg').path }}"
        alt="Grilled arepa with shredded beef and cheese" width="160" height="120" />
      <h1>Arepa Lab</h1>
      <p class="login-subtitle">Sign in to manage the kitchen.</p>
    </div>

    {% if error %}
    <div class="bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 mb-6 text-sm">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/admin/login" class="flex flex-col gap-5">
      <div>
        <label class="block text-sm font-medium text-stone-700 mb-1" for="username">Username</label>
        <input id="username" name="username" type="text" required autofocus
          class="w-full border border-stone-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-700" />
      </div>
      <div>
        <label class="block text-sm font-medium text-stone-700 mb-1" for="password">Password</label>
        <input id="password" name="password" type="password" required
          class="w-full border border-stone-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-700" />
      </div>
      <button type="submit"
        class="bg-orange-800 hover:bg-orange-900 text-white font-semibold rounded-lg py-2 transition-colors">
        Sign in
      </button>
    </form>

    <p class="login-event">{{ workshop().event_name }}</p>
  </main>
</body>

</html>
