<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Cupcake Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-10">

    <div class="text-center mb-8">
      <span class="text-6xl">🧁</span>
      <h1 class="text-2xl font-bold text-gray-800 mt-3">Cupcake Admin</h1>
      <p class="text-gray-500 text-sm mt-1">Sign in to manage the store</p>
    </div>

    {% if error %}
    <div class="bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 mb-6 text-sm">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/admin/login" class="flex flex-col gap-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" for="username">Username</label>
        <input id="username" name="username" type="text" required autofocus
          class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-pink-400" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" for="password">Password</label>
        <input id="password" name="password" type="password" required
          class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-pink-400" />
      </div>
      <button type="submit"
        class="bg-pink-500 hover:bg-pink-600 text-white font-semibold rounded-lg py-2 transition-colors">
        Sign in
      </button>
    </form>

  </div>
</body>
</html>
