<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Admin{% endblock %} — Cupcake Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Top nav -->
  <nav class="bg-pink-600 text-white shadow-md sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-6 py-3 flex items-center justify-between">
      <a href="/admin/orders" class="text-xl font-bold flex items-center gap-2">
        🧁 <span>Cupcake Admin</span>
      </a>
      <div class="flex items-center gap-6 text-sm font-medium">
        <a href="/admin/orders"
           class="hover:text-pink-200 {% block nav_orders %}{% endblock %}">Orders</a>
        <a href="/admin/flavors"
           class="hover:text-pink-200 {% block nav_flavors %}{% endblock %}">Flavors</a>
        <a href="/admin/users"
           class="hover:text-pink-200 {% block nav_users %}{% endblock %}">Users</a>
        <a href="/dashboard" target="_blank"
           class="hover:text-pink-200 border border-pink-400 rounded px-3 py-1">📺 Dashboard</a>
        <form method="post" action="/admin/logout">
          <button type="submit"
            class="bg-pink-800 hover:bg-pink-900 px-3 py-1 rounded transition-colors">
            Logout
          </button>
        </form>
      </div>
    </div>
  </nav>

  <!-- Flash messages -->
  {% if flash %}
  <div class="max-w-6xl mx-auto px-6 mt-4 flex flex-col gap-2">
    {% for f in flash %}
    <div class="px-4 py-3 rounded-lg text-sm font-medium
      {% if f.kind == 'success' %}bg-green-50 border border-green-200 text-green-800
      {% else %}bg-red-50 border border-red-200 text-red-800{% endif %}">
      {{ f.message }}
    </div>
    {% endfor %}
  </div>
  {% endif %}

  <!-- Page content -->
  <main class="max-w-6xl mx-auto px-6 py-8">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
