<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="csrf-token" content="{{ csrf_token(request) }}" />
  <title>{% block title %}Admin{% endblock %} — Arepa Lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  {% include "brand_head.html" %}
</head>

<body class="admin-shell">

  <!-- Top nav -->
  <nav class="admin-nav wood" aria-label="Store administration">
    <div class="admin-nav-inner">
      <a href="/admin/orders" class="brand-lockup">
        <img class="brand-logo" src="{{ url_for('static', path='arepa-lab.svg').path }}" alt="" width="70" height="53" />
        <span class="brand-name">Arepa Lab</span>
      </a>
      <div class="admin-links">
        <a href="/admin/preparing" class="hover:text-stone-300 {% block nav_preparing %}{% endblock %}">Preparing</a>
        <a href="/admin/pickup" class="hover:text-stone-300 {% block nav_pickup %}{% endblock %}">Pickup</a>
        <a href="/admin/orders" class="hover:text-stone-300 {% block nav_orders %}{% endblock %}">Orders</a>
        <a href="/admin/flavors" class="hover:text-stone-300 {% block nav_flavors %}{% endblock %}">Menu</a>
        <a href="/admin/customers" class="hover:text-stone-300 {% block nav_customers %}{% endblock %}">Customers</a>
        <a href="/admin/users" class="hover:text-stone-300 {% block nav_users %}{% endblock %}">Users</a>
        <a href="/dashboard" target="_blank" class="hover:text-stone-300 border border-stone-500 rounded px-3 py-1">📺
          Dashboard</a>
        <form method="post" action="/admin/logout">
          <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}" />
          <button type="submit" class="logout">
            Logout
          </button>
        </form>
      </div>
    </div>
  </nav>

  <!-- Flash messages -->
  {% if flash %}
  <div class="max-w-6xl mx-auto px-6 mt-4 flex flex-col gap-2">
    {% for f in flash %}
    <div class="px-4 py-3 rounded-lg text-sm font-medium
      {% if f.kind == 'success' %}bg-green-50 border border-green-200 text-green-800
      {% else %}bg-red-50 border border-red-200 text-red-800{% endif %}">
      {{ f.message }}
    </div>
    {% endfor %}
  </div>
  {% endif %}

  <!-- Page content -->
  <main class="admin-content">
    <p class="admin-event">{{ workshop().event_name }} · Store administration</p>
    {% block content %}{% endblock %}
  </main>

</body>

</html>
